name: Build Android app

on:
  push:
    branches: [dev]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ALAS-AOS build
        env:
          TOKEN: ${{ secrets.ALAS_AOS_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo 'ALAS_AOS_DISPATCH_TOKEN is not configured; the hourly ALAS-AOS poller will pick up this commit.'
            exit 0
          fi
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/wess09/ALAS-AOS/dispatches \
            -d "{\"event_type\":\"azurpilot_updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"
