name: Git over CDN R2

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      history:
        description: "生成多少个旧提交的更新包"
        required: false
        default: "15"

concurrency:
  group: git-over-cdn-r2
  cancel-in-progress: true

jobs:
  check-config:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      configured: ${{ steps.detect.outputs.configured }}
    steps:
      - name: 检查 R2 发布密钥
        id: detect
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$ACCOUNT_ID" ] && [ -n "$API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "尚未配置 CLOUDFLARE_ACCOUNT_ID 或 CLOUDFLARE_API_TOKEN，跳过 R2 发布。"
          fi

  build-and-upload:
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      R2_BUCKET: alas-updates
      R2_PUBLIC_URL: https://pub-f4ec60a8d3514a0b90f5b43a1e4b9913.r2.dev/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 构建 Git over CDN 更新文件
        env:
          GOC_SITE_URL: ${{ env.R2_PUBLIC_URL }}
          GOC_MIRROR_URLS: ${{ env.R2_PUBLIC_URL }}
        run: |
          set -euo pipefail
          npm --prefix .github/scripts run build:git-over-cdn:eo-esa -- \
            --branch master \
            --history "${{ github.event.inputs.history || '15' }}" \
            --output dist/git-over-cdn \
            --fetch-full
          test -f dist/git-over-cdn/latest.json

      - name: 上传到 Cloudflare R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            key="${file#dist/git-over-cdn/}"
            echo "上传 $key"
            npx wrangler@latest r2 object put "$R2_BUCKET/$key" --file="$file" --remote
          done < <(find dist/git-over-cdn -type f -print0 | sort -z)

