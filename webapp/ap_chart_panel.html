<div style="margin-top:16px; margin-bottom:8px;">
  <div style="font-weight:600; font-size:14px; margin-bottom:8px;">体力变化 - {view_title}</div>
  <div style="display:grid; grid-template-columns:150px 100px 90px 90px 90px; gap:8px; margin-bottom:2px; font-size:12px; color:#aaa;">
    <span>行动力: <b style="color:#64b5f6">{ap_cur}</b></span>
    <span>变化: <b style="color:{change_color}">{change_sign}{ap_change}</b></span>
    <span>最高: <b style="color:#ef5350">{ap_max}</b></span>
    <span>最低: <b style="color:#26a69a">{ap_min}</b></span>
    <span>均值: <b style="color:#ff9800">{ap_avg}</b></span>
  </div>
  {coins_stats_html}
</div>
<div id="{chart_id}_wrapper" style="position:relative;background:#1a1a2e;border-radius:6px;border:1px solid #333;padding:6px;">
  <div id="{chart_id}_echarts" style="width:100%;height:400px;display:block;"></div>
</div>
