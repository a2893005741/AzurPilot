<div style="margin-top:12px; margin-bottom:8px;">
  <!-- 标题行：标题靠左，【刷新】的槽位靠右。槽位由渲染侧在
       put_html 之前建好，是卡片的直接子节点，这里用 order 排到右侧。 -->
  <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
    <div style="font-weight:600; font-size:14px; flex:1 1 auto;">{panel_title}</div>
    <!-- 【刷新】的落点。id 就是 pywebio scope 名，按钮由渲染侧用
         put_button(scope=...) 投进来，天然与标题同一行、贴右。 -->
    <div id="pywebio-scope-ap-chart-refresh" style="flex:0 0 auto; display:flex; align-items:center;"></div>
  </div>
  <!-- 容器挂网格；下面的数据行只做扁平化包装，
       所有 span 都是这个网格的子项，列宽才跨行统一。 -->
  <div class="ap-chart-stats ap-stat-grid" style="margin-bottom:2px;">
    <span>{lbl_ap}: <b style="color:#64b5f6">{ap_cur}</b></span>
    <span>{lbl_change}: <b style="color:{change_color}">{change_sign}{ap_change}</b></span>
    <span>{lbl_max}: <b style="color:#ef5350">{ap_max}</b></span>
    <span>{lbl_min}: <b style="color:#26a69a">{ap_min}</b></span>
    <span>{lbl_mean}: <b style="color:#ff9800">{ap_avg}</b></span>
    {coins_stats_html}
  </div>
</div>
<div id="{chart_id}_legend" class="ap-chart-legend" style="gap:12px;">
  <span class="ap-legend-item" data-series="0" style="display:flex; align-items:center; gap:4px;cursor:pointer;opacity:1;"><span style="width:12px; height:3px; background:var(--ap-series-1); border-radius:1px;"></span>{lbl_ap_series}</span>
  {coins_legend_html}
</div>
<div id="{chart_id}_container" class="ap-chart-box" style="transition:opacity 0.3s ease;">
  <canvas id="{chart_id}" style="width:100%;height:360px;display:block;cursor:crosshair;"></canvas>
  <canvas id="{chart_id}_ov"
    style="position:absolute;top:6px;left:6px;width:calc(100% - 12px);height:360px;pointer-events:none;"></canvas>
  <div id="{chart_id}_tip"
    class="ap-chart-tip">
  </div>
  <div id="{chart_id}_controls" class="ap-chart-ctrl" style="{detail_controls_display}">
    <button id="{chart_id}_zoom_in">+</button>
    <button id="{chart_id}_zoom_out">-</button>
    <button id="{chart_id}_reset">{lbl_reset}</button>
  </div>
</div>
