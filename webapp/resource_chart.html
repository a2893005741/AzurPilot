<div style="margin-top:16px; margin-bottom:8px;">
  <div style="font-weight:600; font-size:14px; margin-bottom:8px;">{title}</div>
  <div id="{chart_id}_stats_row" class="ap-chart-stats" style="display:flex; flex-wrap:wrap; gap:6px 16px; margin-bottom:6px;">
    {stats_html}
  </div>
</div>
<div id="{chart_id}_legend" class="ap-chart-legend" style="gap:8px;">
  {legend_html}
</div>
<div id="{chart_id}_container" class="ap-chart-box">
  <canvas id="{chart_id}" style="width:100%;height:400px;display:block;cursor:crosshair;"></canvas>
  <canvas id="{chart_id}_ov"
    style="position:absolute;top:6px;left:6px;width:calc(100% - 12px);height:400px;pointer-events:none;"></canvas>
  <div id="{chart_id}_tip"
    class="ap-chart-tip" style="max-width:320px;">
  </div>
  <div class="{chart_id}_controls" class="ap-chart-ctrl">
    <button id="{chart_id}_zoom_in">+</button>
    <button id="{chart_id}_zoom_out">-</button>
    <button id="{chart_id}_reset">重置</button>
  </div>
</div>
